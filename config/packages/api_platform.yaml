# The API of this demonstration (beffroi-php/beffroi#556), served under /api/v1 by API Platform and
# reached with an access token of the provider and nothing else: the firewall of that path is what
# decides whether a request gets in (config/packages/security.yaml), and the scope each operation needs
# is written on the operation itself (src/ApiResource/).
#
# It is stateless and says so: no session is started, no cookie is read, and nothing of a request
# survives it. Whoever asks is whoever the token names, which is the whole point of a resource server.
api_platform:
    title: 'Invoices of the demonstration'
    description: |
        The invoices of whoever the access token names, served behind the introspection endpoint of the
        provider (RFC 7662). Every operation needs a token and says which scope that token has to carry.

        The token to present is one the provider issued to the client this API introspects as: it describes
        a token to the client it was issued to and to no other (RFC 7662 section 2.2), so a token obtained
        for another client of the same provider, a rung of the ladder under /c/ for instance, is reported
        inactive here and refused with a 401. The /profile page of this demonstration shows one that works,
        and `castor demo --api` of the provider's repository plays the whole thing from the command line.
    version: 1.0.0

    # Where the resources are, and nowhere else: this application has no Doctrine entity and this API
    # adds none, so the directory API Platform maps is the one holding the classes it serves.
    mapping:
        paths: ['%kernel.project_dir%/src/ApiResource']

    # JSON-LD, which carries the shape of the API, and plain JSON, which is what a client that wants an
    # object and no vocabulary asks for. The documentation is served as both, plus the page.
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    # The document itself, in the media type OpenAPI defines for it, beside the page a human reads and the
    # Hydra documentation of the JSON-LD answers: a client that generates itself from the document asks for
    # "application/vnd.openapi+json" and must not be answered a page.
    docs_formats:
        jsonopenapi: ['application/vnd.openapi+json']
        jsonld: ['application/ld+json']
        json: ['application/json']
        html: ['text/html']

    # What the "Authorize" button of the documentation asks for: the bearer token of RFC 6750 section 2.1,
    # the one scheme this API accepts. Whoever reads the page pastes the access token the provider issued
    # and the page then sends it on every operation, as a client would. The flow of an authorization code
    # is not offered, and could not be: the documentation runs in a browser, so a client it signed in as
    # would be a public client of its own, and the provider describes a token to the client it was issued
    # to (RFC 7662 section 2.2), which is the one this API introspects as and not that one.
    swagger:
        http_auth:
            bearer:
                scheme: bearer

    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
