# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # The policy of the vault, in one place: which authentication context classes answer for
    # REQUIRES_PHR (OpenID Connect EAP ACR Values 1.0). AcrVoter grants on them and AcrValuesListener
    # asks the provider for them, in this order of preference.
    app.acr.accepted_classes: ['phr']

    # How long this API goes on believing an introspection response, in seconds (RFC 7662 section 4):
    # the firewall of /api/v1 caches the answer of an active token for that long, and the answer of
    # /api/v1/account says the same figure, because a resource server that told a client one window and
    # applied another would be two places that must agree. A few seconds is what spares the provider a
    # round trip per request without carrying a revoked token for long.
    app.api.introspection_cache_ttl: 5

    # The realm of the API, in one place: the firewall announces it in the challenge of a request that
    # carries no token (RFC 6750 section 3), and the handler of a refusal for a missing scope announces
    # the same one (section 3.1).
    app.api.realm: 'Invoices of the demonstration'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $providerUri: '%env(OIDC_PROVIDER_URI)%'
            string $clientId: '%env(OIDC_CLIENT_ID)%'

    # The three capabilities of the forge whose classes are what the form offers: a method added is a
    # class written and tagged, and nothing else anywhere (beffroi#582).
    _instanceof:
        App\Forge\Flow\Authentication\ClientAuthenticationInterface:
            tags: ['app.forge.client_authentication']
        App\Forge\Flow\Delivery\AuthorizationResponseInterface:
            tags: ['app.forge.delivery']
        App\Forge\Flow\Binding\TokenBindingInterface:
            tags: ['app.forge.binding']

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # the discovery service the "oidc_login" firewall builds, injected as-is so the
    # demo reads the very document the authenticator uses
    App\Controller\DemoController:
        arguments:
            $discovery: '@security.authenticator.oidc_login.discovery.main'

    # Which provider sessions a logout token ended, for the back-channel logout of the "main"
    # firewall: the pool is one of this instance alone, under the client it is registered as, so
    # that two demos running side by side on one machine, signed in on the same provider session,
    # do not read each other's entries. An application deployed on several servers gives the
    # "cache" option of the firewall the store they share instead, since a logout token reaches
    # any one server and the session it names was opened through another.
    app.oidc_ended_sessions:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments:
            - 'oidc_ended_sessions'
            - 0
            - '%kernel.cache_dir%/oidc-ended-sessions/%env(OIDC_CLIENT_ID)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # The vault of this demonstration: a route that needs an authentication context class rather than
    # a role. The handler is given the "oidc_login" authenticator of the "main" firewall, which is the
    # re-authentication entry point it asks to start a stronger login, and the name of that firewall,
    # under which the target path is saved so the provider sends the user back to /vault.
    App\Security\Acr\AcrVoter:
        arguments:
            $acceptedClasses: '%app.acr.accepted_classes%'

    App\Security\Acr\AcrValuesListener:
        arguments:
            $acceptedClasses: '%app.acr.accepted_classes%'

    App\Security\Acr\AcrReAuthenticationHandler:
        arguments:
            $entryPoint: '@security.authenticator.oidc_login.main'
            $firewallName: 'main'

    # The forge of clients (beffroi#582): the laboratory client of this demonstration, the one thing here
    # that is not Symfony's "oidc_login", because what a composition can ask for is what the authenticator
    # cannot do yet (RP-04, RP-05, RP-06 and RP-07 of the status document).
    #
    # What the provider offers and what the demonstration can play are read, never written down: the
    # document of the provider on one side, the tagged classes on the other, and the form offers the two
    # crossed (App\Forge\TheForm).
    App\Forge\Offer:
        arguments:
            $httpClient: '@http_client'
            $cache: '@cache.app'

    App\Forge\Flow\Jwt:
        arguments:
            $httpClient: '@http_client'
            $cache: '@cache.app'
            $clock: '@clock'

    # RFC 7591 §1.2: the credential the registration endpoint of this tenant asks for, which the console
    # of the provider issues and "castor demo --forge" writes here. Empty, nothing is built and the page
    # says what to run.
    App\Forge\Forge:
        arguments:
            $initialAccessToken: '%env(FORGE_INITIAL_ACCESS_TOKEN)%'

    # RFC 9396 §2: the resource the detail of the preset that asks for one names, which is the resource
    # this demonstration serves.
    App\Forge\Presets:
        arguments:
            $resource: '%env(OIDC_RESOURCE)%'

    App\Forge\BuiltClients:
        arguments:
            $pool: '@app.forge_clients'

    App\Forge\EndedSessions:
        arguments:
            $pool: '@app.forge_ended_sessions'

    # An HTTP client presents a certificate as a file, so what the store holds is written out here, under
    # the handle of the client it belongs to.
    App\Forge\Flow\Authentication\CertificateFiles:
        arguments:
            $directory: '%kernel.project_dir%/var/forge'

    App\Forge\Flow\Authentication\ClientAuthentications:
        arguments:
            $methods: !tagged_iterator app.forge.client_authentication

    App\Forge\Flow\Delivery\Deliveries:
        arguments:
            $shapes: !tagged_iterator app.forge.delivery

    App\Forge\Flow\Binding\Bindings:
        arguments:
            $kinds: !tagged_iterator app.forge.binding

    # What the forge built, and which sessions of the provider its back channel said had ended: two pools
    # of this instance alone, as the one of the "main" firewall below is, so that two demonstrations
    # running side by side on one machine neither read each other's clients nor end each other's sessions.
    app.forge_clients:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments:
            - 'forge_clients'
            - 0
            - '%kernel.cache_dir%/forge-clients'

    app.forge_ended_sessions:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments:
            - 'forge_ended_sessions'
            - 0
            - '%kernel.cache_dir%/forge-ended-sessions'

    # The API of this demonstration (beffroi#556): its state classes read the access token the firewall
    # of /api/v1 obtained, and its book of invoices lives in the cache pool of this application, no
    # entity and no database being what this demonstration is about.
    App\Invoice\InvoiceBook:
        arguments:
            $pool: '@cache.app'

    # Which clients of this demonstration the API may ask the provider about (RFC 7662 section 2.2): every
    # one whose secret this application holds, in the order they are asked. They are the clients declared
    # in the configuration of the provider, which the walks of "castor demo" sign in as. A client the forge
    # built is absent, and its tokens are therefore refused here: it is registered at the provider and
    # gone again within the day, and this list is read when the container is built.
    App\Api\WhicheverClientKnowsTheToken:
        arguments:
            $client: '@introspection.client'
            $clients:
                - { client_id: '%env(OIDC_CLIENT_ID)%', secret: '%env(OIDC_CLIENT_SECRET)%' }
                - { client_id: '%env(DEMO_OPAQUE_CLIENT_ID)%', secret: '%env(DEMO_OPAQUE_SECRET)%' }
                - { client_id: '%env(DEMO_RAR_CLIENT_ID)%', secret: '%env(DEMO_RAR_SECRET)%' }

    # The two handlers the firewalls api_v1_addressed_here and api_v1_described build, chosen between for
    # each token presented to the API (config/packages/security.yaml).
    App\Api\AddressedHereOrDescribed:
        arguments:
            $addressedHere: '@security.access_token_handler.api_v1_addressed_here'
            $described: '@security.access_token_handler.api_v1_described'
            $resource: '%env(API_RESOURCE)%'

    App\Api\TheScopeOfTheOperation:
        arguments:
            $realm: '%app.api.realm%'

    App\State\AccountProvider:
        arguments:
            $introspectionCacheTtl: '%app.api.introspection_cache_ttl%'

    # The tree of features: the configuration a panel shows of the reference client is the file that
    # configures it, and the vault answers for the classes of its policy.
    App\Showcase\Reference\SecurityConfiguration:
        arguments:
            $file: '%kernel.project_dir%/config/packages/security.yaml'

    App\Showcase\Reference\StepUp:
        arguments:
            $acceptedClasses: '%app.acr.accepted_classes%'

    App\Api\OpenApi\TheProviderOfTheFlow:
        arguments:
            $resource: '%env(API_RESOURCE)%'

    App\Showcase\RegisteredClients:
        arguments:
            $pool: '@app.forge_clients'

    App\Showcase\Api\ApiJournal:
        arguments:
            $pool: '@cache.app'

    # The grants that need no browser at the client: what they ask a token for is the API
    # (RFC 8707 §2), the exchange is granted by an initial access token of its own, and the JWT bearer
    # grant presents assertions of an issuer this demonstration plays.
    App\Showcase\Grant\ClientCredentials:
        arguments:
            $resource: '%env(API_RESOURCE)%'

    App\Showcase\Grant\TokenExchange:
        arguments:
            $resource: '%env(API_RESOURCE)%'
            $exchangeInitialAccessToken: '%env(EXCHANGE_INITIAL_ACCESS_TOKEN)%'

    App\Showcase\Grant\JwtBearer:
        arguments:
            $resource: '%env(API_RESOURCE)%'

    App\Showcase\Grant\AssertionIssuer:
        arguments:
            $pool: '@app.forge_clients'
            $issuer: '%env(JWT_BEARER_ISSUER)%'
